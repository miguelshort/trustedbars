nombre: Construir TrustedBars

en:
  empujar:
    ramas: [principal]
  solicitud de extracción:
  flujo_de_trabajo:

permisos:
  Contenido: leer

concurrencia:
  grupo: build-${{ github.ref }}
  cancelación en curso: verdadero

empleos:
  construir:
    runs-on: ubuntu-latest
    pasos:
      - usos: actions/checkout@v4

      - usos: actions/setup-node@v4
        con:
          versión del nodo: 20

      - nombre: Comprobar sintaxis de JavaScript
        correr: |
          nodo --comprobar js/analysis.js
          nodo --verificar data/bars.js
          nodo --check tools/analyze.mjs
          # Script en línea de index.html
          nodo -e "
            const s=require('fs').readFileSync('index.html','utf8');
            const m=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if(!m.length) throw new Error('Script en línea sin texto');
            m.forEach(x=>new Function(x[1]));
            console.log('index.html: OK');"

      - nombre: Comprobar que los archivos referenciados existen
        correr: |
          para f en js/analysis.js data/bars.js; hacer
            grep -q "src=\"$f\"" index.html || { echo "index.html no referencia $f"; exit 1; }
            prueba -f "$f"
          hecho

      - nombre: Prueba de humo del análisis
        correr: |
          nodo -e "
            const A=require('./js/analysis.js');
            const b=A.fromPlace({id:'X',displayName:{text:'Bar'},location:{latitude:37.39,longitude:-5.99},rating:4.5,userRatingCount:900,priceRange:{startPrice:{units:'10'},endPrice:{units:'14'}},types:['bar']});
            if(!b.priceDoc||b.price.week[0]!==10||!b.habitual.weekend) throw new Error('Análisis incorrecto');
            console.log('analysis.js: OK');"

      - nombre: Preparar carpeta de publicación
        correr: |
          mkdir -p dist
          cp -r index.html js data README.md dist/
          cp -r herramientas dist/tools

      - nombre: Empaquetar zip
        ejecutar: cd dist && zip -r ../trustedbars-app.zip .

      - usos: actions/upload-artifact@v4
        con:
          nombre: aplicación de barras de confianza
          ruta: trustedbars-app.zip

      - usos: actions/upload-pages-artifact@v3
        Si: github.ref == 'refs/heads/main'
        con:
          ruta: dist

  desplegar:
    Si: github.ref == 'refs/heads/main'
    necesidades: construir
    runs-on: ubuntu-latest
    permisos:
      páginas: escribir
      id-token: escribir
    ambiente:
      nombre: github-pages
      URL: ${{ steps.deployment.outputs.page_url }}
    pasos:
      - id: despliegue
        Usos: actions/deploy-pages@v4
